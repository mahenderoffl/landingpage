<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>waveseed.co — launching soon</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071521;
      --card: #0f2233;
      --text: #e5f4ff;
      --muted: #98b6cf;
      --accent: #5de3c0;
      --accent-2: #74a5ff;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 10%, #16314a 0, var(--bg) 45%);
      color: var(--text);
      padding: 24px;
    }
    main {
      width: min(680px, 100%);
      background: color-mix(in srgb, var(--card) 92%, #000 8%);
      border: 1px solid #244663;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #132f47;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    h1 {
      margin: 16px 0 8px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.05;
    }
    p {
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }
    form {
      margin-top: 26px;
      display: grid;
      gap: 12px;
    }
    label {
      display: grid;
      gap: 7px;
      font-size: 14px;
      color: var(--muted);
    }
    input, textarea, button {
      border-radius: 12px;
      border: 1px solid #2a4e6d;
      background: #0b1c2b;
      color: var(--text);
      font: inherit;
      padding: 12px 13px;
    }
    textarea { min-height: 120px; resize: vertical; }
    input:focus, textarea:focus, button:focus {
      outline: 2px solid color-mix(in srgb, var(--accent-2) 60%, white 40%);
      outline-offset: 1px;
    }
    button {
      border: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #022537;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.7; cursor: wait; }
    #form-status {
      margin-top: 12px;
      min-height: 24px;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">temporary launch page</span>
    <h1>waveseed.co is taking shape</h1>
    <p>
      We are building something new. If you are reaching out for a collaboration, project, or launch update,
      share your details below and we will get back to you.
    </p>

    <form id="lead-form" novalidate>
      <input type="hidden" name="access_key" value="0ef00235-6a05-4afa-ba89-d242f71dc5ec" />
      <input type="hidden" name="subject" value="New waveseed.co lead" />
      <input type="hidden" name="from_name" value="waveseed.co landing page" />

      <label>
        Full name
        <input type="text" name="name" autocomplete="name" required />
      </label>
      <label>
        Email
        <input type="email" name="email" autocomplete="email" required />
      </label>
      <label>
        What brings you here?
        <textarea name="message" required></textarea>
      </label>

      <button type="submit">Reach out</button>
      <p id="form-status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById('lead-form');
    const status = document.getElementById('form-status');
    const button = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const payload = Object.fromEntries(new FormData(form).entries());
      button.disabled = true;
      status.textContent = 'Sending your note...';

      try {
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || 'Could not send form right now.');
        }

        const firstName = String(payload.name || '').trim().split(/\s+/)[0] || 'there';
        status.textContent = `Thanks, ${firstName}. We got your message and will reach out soon.`;
        form.reset();
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : 'Something went wrong. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
